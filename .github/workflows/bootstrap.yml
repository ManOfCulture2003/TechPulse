name: Bootstrap TechPulse source
on:
  push:
    paths:
      - bootstrap/READY.txt
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited source bundle
        if: hashFiles('bootstrap/READY.txt') != ''
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, io, lzma, tarfile
          payload = ''.join(Path(f'bootstrap/chunk-{i}.txt').read_text().strip() for i in range(1, 5))
          archive = lzma.decompress(base64.b64decode(payload, validate=True))
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tf:
              for entry in tf.getmembers():
                  path = PurePosixPath(entry.name)
                  if entry.name.startswith('/') or '..' in path.parts or not entry.isfile():
                      raise ValueError('Unsafe archive entry')
                  destination = Path(entry.name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(tf.extractfile(entry).read())
          PY
      - name: Commit application
        if: hashFiles('bootstrap/READY.txt') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf bootstrap
          git add -A
          git commit -m "Publish TechPulse MVP application with tests and docs"
          git push
